name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: CLI smoke test (no browser needed)
        run: |
          render-gap diff tests/fixtures/spa_raw.html tests/fixtures/spa_rendered.html --url https://example.com/boas-surgery --md /tmp/report.md --json /tmp/report.json
          test -s /tmp/report.md
          test -s /tmp/report.json
      - name: The CI gate must fail a client-rendered page
        run: |
          set +e
          render-gap diff tests/fixtures/spa_raw.html tests/fixtures/spa_rendered.html --min-score 80 --md /tmp/gate.md
          code=$?
          set -e
          test "$code" -eq 1

  action:
    name: The action must run against a real page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this repository's own action
        uses: ./
        with:
          urls: https://example.com/
          min-score: "80"
          markdown: example-com.md
          json: example-com.json
      - name: The reports must exist
        run: |
          test -s example-com.md
          test -s example-com.json
